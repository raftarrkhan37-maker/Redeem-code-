    function randomSep() {
      return pick(seps);
    }
    function randomEmoji(count) {
      const n = count || rand(1, 3);
      let out = '';
      for (let i = 0; i < n; i++) out += pick(emojis);
      return out;
    }
    function wrapEmojis(msg) {
      if (Math.random() < 0.07) return randomEmoji(rand(2, 5));
      const roll = rand(1, 6);
      const e1 = Math.random() < 0.55 ? randomEmoji(rand(1, 2)) : '';
      const e2 = Math.random() < 0.45 ? randomEmoji(rand(1, 2)) : '';
      if (roll === 1 && e1) return e1 + ' ' + msg;
      if (roll === 2 && e2) return msg + ' ' + e2;
      if (roll === 3 && e1 && e2) return e1 + ' ' + msg + ' ' + e2;
      if (roll === 4 && e1) return msg + ' ' + e1 + e1;
      if (roll === 5 && Math.random() < 0.4) return msg + ' ' + randomEmoji(1);
      return msg;
    }
    function randomName() {
      if (Math.random() < 0.1) {
        return pick(nameParts.first) + pick(nameParts.tag) + rand(1, 99);
      }
      const builders = [
        () => pick(nameParts.first) + pick(['_', '.', '']) + pick(nameParts.tag) + rand(1, 999),
        () => pick(nameParts.first).slice(0, rand(3, 6)) + rand(10, 9999),
        () => pick(nameParts.city).slice(0, rand(3, 5)).toLowerCase() + pick(nameParts.tag) + rand(1, 99),
        () => String.fromCharCode(rand(97, 122)) + pick(nameParts.first) + rand(1, 999),
        () => pick(nameParts.first).toLowerCase() + rand(100, 9999),
        () => pick(nameParts.tag) + pick(nameParts.first) + rand(1, 99),
        () => pick(nameParts.first) + rand(1988, 2012),
        () => 'x' + pick(nameParts.first) + rand(1, 999),
        () => pick(nameParts.first) + pick(nameParts.city).slice(0, 3) + rand(1, 9)
      ];
      return pick(builders)();
    }
    function randomMessage() {
      if (Math.random() < 0.1) {
        return wrapEmojis(pick(rareTemplates));
      }
      const s = rand(1, 10);
      let msg = '';
      if (s <= 3) {
        msg = maybe(msgParts.open, 0.7) +
          pick(msgParts.thing) + ' ' +
          pick(msgParts.status) +
          (Math.random() < 0.5 ? randomSep() + pick(msgParts.end) : '');
      } else if (s <= 5) {
        msg = pick(msgParts.city) + ' se' + randomSep() +
          pick(msgParts.thing) + ' ' +
          pick(msgParts.status);
      } else if (s <= 7) {
        msg = pick(msgParts.time) + ' me ' +
          pick(msgParts.status) + randomSep() +
          pick(msgParts.good) +
          maybe(msgParts.end, 0.4);
      } else if (s === 8) {
        msg = pick(msgParts.open) + randomSep() +
          pick(msgParts.good) + ' ' +
          pick(msgParts.thing) + ' ' +
          pick(msgParts.status);
      } else {
        msg = pick(msgParts.thing) + ' ' +
          pick(msgParts.status) + randomSep() +
          pick(msgParts.end);
      }
      return wrapEmojis(msg.replace(/\s+/g, ' ').trim());
    }
    function randomTime() {
      if (Math.random() < 0.4) return 'just now';
      return rand(1, 9) + 's ago';
    }
    function randomColor() {
      if (Math.random() < 0.5) {
        return 'hsl(' + rand(0, 360) + ',' + rand(45, 75) + '%,' + rand(38, 52) + '%)';
      }
      return pick(avatarColors);
    }
    function getInitial(name) {
      const c = name.replace(/[^a-zA-Z]/, '').charAt(0);
      return (c || 'U').toUpperCase();
    }
    function updateCommentCount() {
      commentTotal += rand(1, 5);
      if (commentCountEl) {
        commentCountEl.textContent = commentTotal.toLocaleString() + ' watching';
      }
    }
    function renderComment(name, text, time) {
      const el = document.createElement('div');
      el.className = 'comment';
      const av = document.createElement('div');
      av.className = 'comment-avatar';
      av.style.background = randomColor();
      av.textContent = getInitial(name);
      const body = document.createElement('div');
      body.className = 'comment-body';
      const meta = document.createElement('div');
      meta.className = 'comment-meta';
      const nameEl = document.createElement('span');
      nameEl.className = 'comment-name';
      nameEl.textContent = name;
      const timeEl = document.createElement('span');
      timeEl.className = 'comment-time';
      timeEl.textContent = time;
      const textEl = document.createElement('p');
      textEl.className = 'comment-text';
      textEl.textContent = text;
      meta.appendChild(nameEl);
      meta.appendChild(timeEl);
      body.appendChild(meta);
      body.appendChild(textEl);
      el.appendChild(av);
      el.appendChild(body);
      return el;
    }
    function showTyping(name) {
      if (!typingBar || !typingAvatar) return;
      typingAvatar.style.background = randomColor();
      typingBar.classList.remove('hidden');
    }
    function hideTyping() {
      if (typingBar) typingBar.classList.add('hidden');
    }
    function pushComment(name, text, time) {
      chatList.appendChild(renderComment(name, text, time));
      while (chatList.children.length > maxChats) {
        chatList.removeChild(chatList.firstChild);
      }
      chatList.scrollTop = chatList.scrollHeight;
      updateCommentCount();
    }
    function postInstantComment() {
      pushComment(randomName(), randomMessage(), 'just now');
    }
    function postWithTyping(callback) {
      const name = randomName();
      const text = randomMessage();
      showTyping(name);
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        hideTyping();
        pushComment(name, text, randomTime());
        if (callback) callback();
      }, rand(250, 700));
    }
    function pickBurstSize() {
      const r = Math.random();
      if (r < 0.42) return 1;
      if (r < 0.72) return 2;
      if (r < 0.92) return 3;
      return rand(3, 4);
    }
    function runBurst(left, isFirst, burstTotal) {
      if (left <= 0) {
        const pause = burstTotal === 1 ? rand(1600, 3400) : rand(800, 1900);
        cycleTimer = setTimeout(runCommentCycle, pause);
        return;
      }
      const next = () => {
        setTimeout(() => runBurst(left - 1, false, burstTotal), rand(80, 280));
      };
      if (isFirst) {
        postWithTyping(next);
      } else {
        postInstantComment();
        next();
      }
    }
    function runCommentCycle() {
      if (!chatList) return;
      const burst = pickBurstSize();
      runBurst(burst, true, burst);
    }
    for (let i = 0; i < 5; i++) {
      pushComment(randomName(), randomMessage(), i === 4 ? 'just now' : rand(1, 8) + 's ago');
    }
    runCommentCycle();
    setInterval(updateCommentCount, 3000);
  </script>
